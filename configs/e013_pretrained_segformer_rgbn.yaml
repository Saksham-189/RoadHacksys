seed: 42
manifest: data/expanded_v2/final_manifest.csv
output_dir: runs/e013_pretrained_segformer_rgbn

model:
  pretrained_name: nvidia/segformer-b0-finetuned-ade-512-512
  local_files_only: true

data:
  mean: [0.485, 0.456, 0.406, 0.47012462]
  std: [0.229, 0.224, 0.225, 0.24413434]
  batch_size: 4
  workers: 2
  occlusion_probability: 0.40

training:
  epochs: 20
  patience: 5
  encoder_learning_rate: 0.00002
  head_learning_rate: 0.0001
  weight_decay: 0.01
  gradient_clip: 1.0
  accumulation_steps: 2
  amp: true

evaluation:
  threshold_min: 0.10
  threshold_max: 0.80
  threshold_steps: 29
  relaxed_radius: 2
